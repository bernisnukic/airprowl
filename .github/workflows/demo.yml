name: Demo GIF

# Manually-triggered: records docs/demo.gif from `airprowl --demo` using the vhs
# Docker image (which bundles ttyd/ffmpeg/chromium) in a clean CI environment,
# and uploads it as an artifact. Run from the Actions tab, then download the GIF.
on:
  workflow_dispatch:

jobs:
  record:
    name: Record demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The vhs image lives on ghcr; authenticate so the pull is reliable.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record demo GIF
        run: bash scripts/record-demo.sh

      - name: Upload GIF
        uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error
