name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Linux binary
    runs-on: ubuntu-22.04 # older glibc for broader compatibility
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libusb-1.0-0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      # GITHUB_REF_NAME is a runner-provided env var (the tag/branch name) — used
      # as a shell variable, not ${{ }} interpolation, so it can't inject.
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/airprowl-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" airprowl
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airprowl-linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            ## Linux x86_64

            ```bash
            tar xzf airprowl-*-x86_64-linux.tar.gz
            ./airprowl            # BT + WiFi APs (no root)
            sudo ./airprowl       # + WiFi client sniffing + Yard Stick One
            ```

            Runtime deps: `network-manager`, `iw`, `bluez`, `libusb` (see the README). Built on Ubuntu 22.04 (glibc 2.35).
