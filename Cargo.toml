[package]
name = "airprowl"
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
description = "Real-time Bluetooth, WiFi, and Sub-GHz wireless scanner TUI for Linux and macOS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bernisnukic/airprowl"
keywords = ["bluetooth", "wifi", "sub-ghz", "scanner", "tui"]
categories = ["command-line-utilities", "network-programming"]
# Only what a build needs; the demo GIF, Dockerfiles and CI stay on GitHub.
include = ["src/**/*.rs", "data/*.txt", "macos/Info.plist", "build.rs", "README.md", "LICENSE"]

[[bin]]
name = "airprowl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"
unicode-width = "0.2"

# BlueZ for Bluetooth; raw 802.11 capture for monitor-mode client sniffing.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
pnet = "0.35"
libwifi = "0.5"

# CoreBluetooth for BLE; libusb compiled in so release builds need no Homebrew.
[target.'cfg(target_os = "macos")'.dependencies]
btleplug = "0.13"
rusb = { version = "0.9", features = ["vendored"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
