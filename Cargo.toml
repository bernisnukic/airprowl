[package]
name = "airprowl"
version = "1.0.0"
edition = "2021"
description = "Real-time Bluetooth & WiFi scanner TUI"
license = "MIT"

[[bin]]
name = "airprowl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
bluer = { version = "0.17", features = ["bluetoothd"] }
pnet = "0.35"
libwifi = "0.5"
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio-util = { version = "0.7", features = ["rt"] }
nix = { version = "0.29", features = ["user", "net"] }
libc = "0.2"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
